name: Build Rustamoff Jeans APK

on:
  push:
    branches:
      - apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Rustamoff logo
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/assets/rustamoff_logo.b64 > app/src/main/res/drawable/app_icon.webp
          cp app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/splash_logo.webp

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk "apk-output/Rustamoff-jeans.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rustamoff-jeans-APK
          path: apk-output/Rustamoff-jeans.apk
          if-no-files-found: error
