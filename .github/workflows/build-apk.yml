name: Build Rustamoff Jeans APK

on:
  push:
    branches:
      - apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply balanced v1.4 spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/rustamoff/jeans/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          replacements = {
              'final int extraTop = dp(26);': 'final int extraTop = dp(10);',
              'final int extraBottom = dp(34);': 'final int extraBottom = dp(14);',
              '.app{padding-top:22px!important;padding-bottom:170px!important;}': '.app{padding-top:8px!important;padding-bottom:132px!important;}',
              '.bottom-nav{bottom:24px!important;}': '.bottom-nav{bottom:12px!important;}',
              '.floating-add{bottom:108px!important;}': '.floating-add{bottom:86px!important;}',
              '.modal-backdrop{padding-top:28px!important;padding-bottom:24px!important;}': '.modal-backdrop{padding-top:18px!important;padding-bottom:12px!important;}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing spacing source: {old}')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          if "versionCode 4" not in g or "versionName '1.3'" not in g:
              raise SystemExit('Unexpected app version source')
          g = g.replace('versionCode 4', 'versionCode 5', 1)
          g = g.replace("versionName '1.3'", "versionName '1.4'", 1)
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk "apk-output/Rustamoff-jeans-v1.4.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rustamoff-jeans-v1.4-APK
          path: apk-output/Rustamoff-jeans-v1.4.apk
          if-no-files-found: error
